apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Styyde/flask-gitops---public-veille-immobiliere.git
    targetRevision: main
    path: monitoring
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD de kube-prometheus-stack (Prometheus, Alertmanager, etc.) ont un
      # schéma trop volumineux pour l'apply client-side classique : le manifeste
      # complet stocké dans l'annotation kubectl.kubernetes.io/last-applied-configuration
      # dépasse la limite Kubernetes de 262144 octets par annotation. Le Server-Side
      # Apply évite ce mécanisme et corrige les erreurs "Too long" sur les CRD.
      - ServerSideApply=true