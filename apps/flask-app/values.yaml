replicaCount: 2

image:
  repository: 269809344861.dkr.ecr.eu-west-3.amazonaws.com/veille-immo-api
  tag: b0a05df608c50bcb74af2606de8d60b8cf65211f
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
  protocol: TCP

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Un seul ALB partagé entre flask-app et Grafana (cf. monitoring/values.yaml
    # -> même group.name) plutôt qu'un ALB par service : les annotations
    # de niveau listener/LB (scheme, listen-ports, ssl-redirect) doivent donc
    # rester identiques entre les deux Ingress du groupe.
    alb.ingress.kubernetes.io/group.name: veille-immo-shared
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Le controller ne crée un listener HTTPS:443 que si on le lui demande
    # explicitement via listen-ports (sinon ssl-redirect pointe vers un
    # listener 443 qui n'existe jamais -> erreur "listener does not exist
    # for SSLRedirect port: 443"). Pas d'ARN de certificat en dur : une fois
    # le listener 443 déclaré, l'AWS Load Balancer Controller découvre
    # automatiquement le certificat ACM correspondant au host de l'ingress
    # (le certificat wildcard *.kolynois.com créé par Terraform, cf. main.tf).
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: '5000'
  hosts:
    - host: amandal.kolynois.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Empêche un scale-down de node / une mise à jour de node group
# (aws_eks_node_group.application_workers.update_config.max_unavailable = 1,
# cf. terraform/main.tf) de descendre à 0 pod disponible simultanément.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  FLASK_APP: "api.app"
  ENV: "production"

secret:
  enabled: true # injecte le Secret K8s (rempli par External Secrets Operator) dans le pod

# Les identifiants DB ne sont JAMAIS stockés ici : ExternalSecret les récupère
# depuis AWS Secrets Manager (secret créé par Terraform) via External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  remoteRef:
    key: veille-immo-prod-db-credentials # doit correspondre à ${db_secret_name} (sortie Terraform)
  refreshInterval: 1h

probes:
  liveness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5

nodeSelector: {}
tolerations: []
# Anti-affinité "preferred" (pas "required") : avec node_min_size=2 rien ne
# garantit qu'il y a toujours un node par AZ disponible au moment du
# scheduling -- required bloquerait le pod en Pending si les 2 AZ n'ont
# pas de capacité libre. Preferred répartit les pods par AZ quand c'est
# possible, sans jamais empêcher le scheduling. Complète le PDB
# (minAvailable: 1) : celui-ci protège contre un drain/déploiement, ceci
# protège contre la perte d'une AZ entière.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flask-app