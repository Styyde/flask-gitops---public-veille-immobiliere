apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-rds
  labels:
    # Label lu par le sidecar Grafana de kube-prometheus-stack (activé par
    # défaut) pour charger automatiquement ce ConfigMap comme dashboard.
    grafana_dashboard: "1"
data:
  rds.json: |
    {
      "title": "RDS PostgreSQL (veille-immo)",
      "uid": "rds-veille-immo",
      "schemaVersion": 39,
      "timezone": "browser",
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU (%)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "red", "value": 80 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "aws_rds_cpuutilization_average",
              "legendFormat": "{{ "{{dimension_DBInstanceIdentifier}}" }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Espace disque libre",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 2147483648 },
                  { "color": "green", "value": 5368709120 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "aws_rds_free_storage_space_average",
              "legendFormat": "{{ "{{dimension_DBInstanceIdentifier}}" }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Connexions actives",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 60 },
                  { "color": "red", "value": 80 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "aws_rds_database_connections_average",
              "legendFormat": "{{ "{{dimension_DBInstanceIdentifier}}" }}"
            }
          ]
        }
      ]
    }
