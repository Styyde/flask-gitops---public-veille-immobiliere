apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: veille-immo-prod-grafana-admin # doit correspondre à ${grafana_secret_name} (sortie Terraform)
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: veille-immo-prod-grafana-admin # doit correspondre à ${grafana_secret_name} (sortie Terraform)
        property: admin-password
